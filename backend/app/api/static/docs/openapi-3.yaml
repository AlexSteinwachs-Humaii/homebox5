info:
    contact:
        name: Homebox Team
        url: https://discord.homebox.software
    description: Track, Manage, and Organize your Things.
    title: Homebox API
    version: "1.0"
openapi: 3.0.0
paths:
    /v1/actions/create-missing-thumbnails:
        post:
            description: Creates thumbnails for items that are missing them
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1.ActionAmountResult'
                    description: OK
            security:
                - Bearer: []
            summary: Create Missing Thumbnails
            tags:
                - Actions
    /v1/actions/ensure-asset-ids:
        post:
            description: Ensures all items in the database have an asset ID
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1.ActionAmountResult'
                    description: OK
            security:
                - Bearer: []
            summary: Ensure Asset IDs
            tags:
                - Actions
    /v1/actions/ensure-import-refs:
        post:
            description: Ensures all items in the database have an import ref
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1.ActionAmountResult'
                    description: OK
            security:
                - Bearer: []
            summary: Ensures Import Refs
            tags:
                - Actions
    /v1/actions/set-primary-photos:
        post:
            description: Sets the first photo of each item as the primary photo
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1.ActionAmountResult'
                    description: OK
            security:
                - Bearer: []
            summary: Set Primary Photos
            tags:
                - Actions
    /v1/actions/wipe-inventory:
        post:
            description: Deletes all items in the inventory
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/v1.WipeInventoryOptions'
                description: Wipe options
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1.ActionAmountResult'
                    description: OK
            security:
                - Bearer: []
            summary: Wipe Inventory
            tags:
                - Actions
    /v1/actions/zero-item-time-fields:
        post:
            description: Resets all item date fields to the beginning of the day
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1.ActionAmountResult'
                    description: OK
            security:
                - Bearer: []
            summary: Zero Out Time Fields
            tags:
                - Actions
    /v1/assets/{id}:
        get:
            parameters:
                - description: Asset ID
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/repo.PaginationResult-repo_EntitySummary'
                    description: OK
            security:
                - Bearer: []
            summary: Get Item by Asset ID
            tags:
                - Items
    /v1/currencies:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/currencies.Currency'
                    description: OK
            summary: Currency
            tags:
                - Base
    /v1/entities:
        get:
            parameters:
                - description: search string
                  in: query
                  name: q
                  schema:
                    type: string
                - description: page number
                  in: query
                  name: page
                  schema:
                    type: integer
                - description: items per page
                  in: query
                  name: pageSize
                  schema:
                    type: integer
                - description: tags Ids
                  explode: true
                  in: query
                  name: tags
                  schema:
                    items:
                        type: string
                    type: array
                - description: parent Ids
                  explode: true
                  in: query
                  name: parentIds
                  schema:
                    items:
                        type: string
                    type: array
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/repo.EntityListResult'
                    description: OK
            security:
                - Bearer: []
            summary: Query All Entities
            tags:
                - Entities
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/repo.EntityCreate'
                description: Entity Data
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/repo.EntityOut'
                    description: Created
            security:
                - Bearer: []
            summary: Create Entity
            tags:
                - Entities
    /v1/entities/{id}:
        delete:
            parameters:
                - description: Entity ID
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "204":
                    description: No Content
            security:
                - Bearer: []
            summary: Delete Entity
            tags:
                - Entities
        get:
            parameters:
                - description: Entity ID
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/repo.EntityOut'
                    description: OK
            security:
                - Bearer: []
            summary: Get Entity
            tags:
                - Entities
        patch:
            parameters:
                - description: Entity ID
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/repo.EntityPatch'
                description: Entity Data
