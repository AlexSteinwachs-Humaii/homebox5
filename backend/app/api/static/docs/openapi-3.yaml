        attachment.Type:
            enum:
                - attachment
                - photo
                - manual
                - warranty
                - attachment
                - receipt
                - thumbnail
            type: string
            x-enum-varnames:
                - DefaultType
                - TypePhoto
                - TypeManual
                - TypeWarranty
                - TypeAttachment
                - TypeReceipt
                - TypeThumbnail
        authroles.Role:
            enum:
                - user
                - admin
                - user
                - attachments
            type: string
            x-enum-varnames:
                - DefaultRole
                - RoleAdmin
                - RoleUser
                - RoleAttachments
        csvexport.Scope:
            enum:
                - collection
                - account-private
                - cross-collection
            type: string
            x-enum-varnames:
                - ScopeCollection
                - ScopeAccountPrivate
                - ScopeCrossCollection
        csvexport.Status:
            enum:
                - queued
                - queued
                - running
                - completed
                - generation-failed
                - storage-failed
                - cleanup-pending
            type: string
            x-enum-varnames:
                - DefaultStatus
                - StatusQueued
                - StatusRunning
                - StatusCompleted
                - StatusGenerationFailed
                - StatusStorageFailed
                - StatusCleanupPending
