components:
    requestBodies:
        services.CSVCaptureRequest:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/services.CSVCaptureRequest'
            description: Validated source capture
            required: true
        services.CSVRetentionPolicy:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/services.CSVRetentionPolicy'
            description: Whole-day retention
            required: true
